server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 144.31.97.89;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/alias-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://144.31.97.89$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 144.31.97.89;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/144.31.97.89/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/144.31.97.89/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AliasSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 16k;
    access_log /var/log/nginx/alias.access.log combined;
    error_log /var/log/nginx/alias.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }
}
